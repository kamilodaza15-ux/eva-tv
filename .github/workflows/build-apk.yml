name: Compilar EVA TV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon -PverCode=${{ github.run_number }}

      - name: Publicar APK en Releases (enlace fijo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk EVA-TV.apk
          echo "${{ github.run_number }}" > version.txt
          gh release delete latest -y --cleanup-tag || true
          gh release create latest EVA-TV.apk version.txt --title "EVA TV" --notes "APK listo para instalar en el Android TV"
